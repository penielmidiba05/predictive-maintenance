subset: FD001
horizon: 30
split_path: configs/split_FD001.json
windows: [5, 10, 20]
cv_folds: 5
seed: 42

# Coûts des erreurs (hypothèse métier)
cost_fn: 10   # panne ratée
cost_fp: 1    # maintenance inutile

tracking_uri: sqlite:///mlflow.db
experiment_name: predictive-maintenance

models:
  logreg:
    C: 1.0
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31